services:
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    volumes:
      - election-data:/app/data
    restart: unless-stopped
    expose:
      - "3000"
  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  election-data:
